<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name List Manager</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 24px;
            font-size: 28px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .add-btn {
            width: 50px;
            padding: 12px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-btn:hover:not(:disabled) {
            background: #38a169;
        }
        .add-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .name-list {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .name-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f7fafc;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
        }
        .name-text {
            color: #2d3748;
            font-size: 16px;
        }
        .remove-btn {
            width: 32px;
            height: 32px;
            background: #f56565;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .remove-btn:hover {
            background: #e53e3e;
        }
        .bottom-buttons {
            display: flex;
            gap: 12px;
        }
        .bottom-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .save-btn {
            background: #667eea;
            color: white;
        }
        .save-btn:hover {
            background: #5568d3;
        }
        .clear-btn {
            background: #ed8936;
            color: white;
        }
        .clear-btn:hover {
            background: #dd6b20;
        }
        .empty-state {
            text-align: center;
            padding: 32px;
            color: #a0aec0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Name List</h1>

        <div class="input-row">
            <input type="text" id="nameInput" placeholder="Enter a name" autocomplete="off">
            <button class="add-btn" id="addBtn" disabled
                    hx-post="/add-name"
                    hx-trigger="click"
                    hx-target="#nameList"
                    hx-swap="innerHTML"
                    onclick="addName()">+</button>
        </div>

        <div class="name-list" id="nameList">
            <div class="empty-state">No names yet. Add one above!</div>
        </div>

        <div class="bottom-buttons">
            <button class="save-btn" onclick="saveList()">Save List</button>
            <button class="clear-btn"
                    hx-post="/clear"
                    hx-trigger="click"
                    hx-target="#nameList"
                    hx-swap="innerHTML"
                    onclick="clearList()">Clear All</button>
        </div>
    </div>

    <script>
        let names = [];

        // Load names from localStorage on page load
        function loadNames() {
            const saved = localStorage.getItem('nameList');
            if (saved) {
                names = JSON.parse(saved);
                renderNames();
            }
        }

        // Render the name list
        function renderNames() {
            const container = document.getElementById('nameList');

            if (names.length === 0) {
                container.innerHTML = '<div class="empty-state">No names yet. Add one above!</div>';
                return;
            }

            container.innerHTML = names.map((name, index) => `
                <div class="name-box">
                    <span class="name-text">${escapeHtml(name)}</span>
                    <button class="remove-btn"
                            hx-post="/remove/${index}"
                            hx-trigger="click"
                            hx-target="#nameList"
                            hx-swap="innerHTML"
                            onclick="removeName(${index})">×</button>
                </div>
            `).join('');
        }

        // Add a name to the list
        function addName() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();

            if (name) {
                names.push(name);
                input.value = '';
                renderNames();
                updateAddButton();
            }
            return false; // Prevent HTMX from making actual request
        }

        // Remove a name from the list
        function removeName(index) {
            names.splice(index, 1);
            renderNames();
            return false; // Prevent HTMX from making actual request
        }

        // Save the list to localStorage
        function saveList() {
            localStorage.setItem('nameList', JSON.stringify(names));
            alert('List saved!');
        }

        // Clear all names
        function clearList() {
            if (confirm('Are you sure you want to clear all names?')) {
                names = [];
                localStorage.removeItem('nameList');
                renderNames();
            }
            return false; // Prevent HTMX from making actual request
        }

        // Update add button state
        function updateAddButton() {
            const input = document.getElementById('nameInput');
            const btn = document.getElementById('addBtn');
            btn.disabled = input.value.trim() === '';
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Intercept HTMX requests and handle them client-side
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.preventDefault();
        });

        // Event listeners
        document.getElementById('nameInput').addEventListener('input', updateAddButton);
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('addBtn').disabled) {
                addName();
            }
        });

        // Load names on page load
        loadNames();
    </script>
</body>
</html>
