<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name List Manager</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            flex: 1;
        }
        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 200px;
        }
        h1 {
            color: #333;
            margin-bottom: 24px;
            font-size: 28px;
        }
        h2 {
            color: #333;
            margin-bottom: 16px;
            font-size: 18px;
        }
        .input-section {
            margin-bottom: 24px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .radio-group {
            margin-bottom: 12px;
        }
        .radio-group-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }
        .radio-options {
            display: flex;
            gap: 16px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .radio-option input[type="radio"] {
            width: auto;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }
        .radio-option label {
            font-size: 14px;
            color: #2d3748;
            cursor: pointer;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .clear-input-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background: #cbd5e0;
            color: #4a5568;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }
        .clear-input-btn.show {
            display: flex;
        }
        .clear-input-btn:hover {
            background: #a0aec0;
        }
        .add-btn {
            width: 50px;
            padding: 12px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-btn:hover:not(:disabled) {
            background: #38a169;
        }
        .add-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        /* Name validation error message */
        .name-error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: -12px;
            margin-bottom: 12px;
            display: none;
        }
        .name-error-message.show {
            display: block;
        }
        .name-list {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .name-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f7fafc;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
        }
        .name-text {
            color: #2d3748;
            font-size: 16px;
        }
        .remove-btn {
            width: 32px;
            height: 32px;
            background: #f56565;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .remove-btn:hover {
            background: #e53e3e;
        }
        .bottom-buttons {
            display: flex;
            gap: 12px;
        }
        .bottom-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .save-btn {
            background: #667eea;
            color: white;
        }
        .save-btn:hover {
            background: #5568d3;
        }
        .clear-btn {
            background: #ed8936;
            color: white;
        }
        .clear-btn:hover {
            background: #dd6b20;
        }
        .empty-state {
            text-align: center;
            padding: 32px;
            color: #a0aec0;
            font-style: italic;
        }
        .complete-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .complete-name {
            padding: 8px 12px;
            background: #edf2f7;
            border-radius: 4px;
            color: #4a5568;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Current List</h1>

            <div class="input-section">
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="nameInput" placeholder="Enter a name" autocomplete="off">
                        <button class="clear-input-btn" id="clearInputBtn" onclick="clearInput()">×</button>
                    </div>
                    <button class="add-btn" id="addBtn" disabled
                            hx-post="/add-name"
                            hx-trigger="click"
                            hx-target="#currentList"
                            hx-swap="innerHTML"
                            onclick="addName()">+</button>
                </div>
                <div class="name-error-message" id="nameErrorMessage"></div>

                <div class="radio-group">
                    <span class="radio-group-label">Pool</span>
                    <div class="radio-options">
                        <div class="radio-option">
                            <input type="radio" id="poolA" name="pool" value="A">
                            <label for="poolA">A</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="poolB" name="pool" value="B">
                            <label for="poolB">B</label>
                        </div>
                    </div>
                </div>

                <div class="radio-group">
                    <span class="radio-group-label">Ace</span>
                    <div class="radio-options">
                        <div class="radio-option">
                            <input type="radio" id="aceYes" name="ace" value="true">
                            <label for="aceYes">Yes</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="aceNo" name="ace" value="false">
                            <label for="aceNo">No</label>
                        </div>
                    </div>
                </div>

                <div class="radio-group">
                    <span class="radio-group-label">CTP</span>
                    <div class="radio-options">
                        <div class="radio-option">
                            <input type="radio" id="ctpYes" name="ctp" value="true">
                            <label for="ctpYes">Yes</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="ctpNo" name="ctp" value="false">
                            <label for="ctpNo">No</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="name-list" id="currentList">
                <div class="empty-state">No names yet. Add one above!</div>
            </div>

            <div class="bottom-buttons">
                <button class="save-btn" onclick="saveList()">Save List</button>
                <button class="clear-btn"
                        hx-post="/clear"
                        hx-trigger="click"
                        hx-target="#currentList"
                        hx-swap="innerHTML"
                        onclick="clearList()">Clear All</button>
            </div>
        </div>

        <div class="sidebar">
            <h2>Complete List</h2>
            <div class="complete-list" id="completeList">
                <div class="empty-state" style="padding: 16px; font-size: 14px;">No names yet</div>
            </div>
        </div>
    </div>

    <script>
        let currentList = [];
        let completeList = [];

        // Load names from localStorage on page load
        function loadNames() {
            const savedCurrent = localStorage.getItem('currentList');
            const savedComplete = localStorage.getItem('completeList');

            if (savedCurrent) {
                currentList = JSON.parse(savedCurrent);
            }
            if (savedComplete) {
                completeList = JSON.parse(savedComplete);
            }

            renderCurrentList();
            renderCompleteList();
        }

        // Render the current list
        function renderCurrentList() {
            const container = document.getElementById('currentList');

            if (currentList.length === 0) {
                container.innerHTML = '<div class="empty-state">No names yet. Add one above!</div>';
                return;
            }

            container.innerHTML = currentList.map((item, index) => `
                <div class="name-box">
                    <span class="name-text">${escapeHtml(item.name)}</span>
                    <button class="remove-btn"
                            hx-post="/remove/${index}"
                            hx-trigger="click"
                            hx-target="#currentList"
                            hx-swap="innerHTML"
                            onclick="removeName(${index})">×</button>
                </div>
            `).join('');
        }

        // Render the complete list
        function renderCompleteList() {
            const container = document.getElementById('completeList');

            if (completeList.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding: 16px; font-size: 14px;">No names yet</div>';
                return;
            }

            container.innerHTML = completeList.map(item => `
                <div class="complete-name">${escapeHtml(item.name)}</div>
            `).join('');
        }

        // Add a name to both lists
        function addName() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();

            // Get radio button values
            const aceValue = document.querySelector('input[name="ace"]:checked')?.value;
            const ctpValue = document.querySelector('input[name="ctp"]:checked')?.value;
            const poolValue = document.querySelector('input[name="pool"]:checked')?.value;

            if (name && aceValue !== undefined && ctpValue !== undefined && poolValue !== undefined) {
                // Check if name already exists in current list (case-insensitive)
                const nameInCurrent = currentList.some(item => item.name.toLowerCase() === name.toLowerCase());
                if (nameInCurrent) {
                    showNameError('That name is already in the list');
                    return false;
                }

                // Add to current list with full data
                currentList.push({
                    name: name,
                    ace: aceValue === 'true',
                    ctp: ctpValue === 'true',
                    pool: poolValue
                });

                // Only add to complete list if not already there (case-insensitive)
                const nameInComplete = completeList.some(item => item.name.toLowerCase() === name.toLowerCase());
                if (!nameInComplete) {
                    completeList.push({
                        name: name,
                        pool: poolValue
                    });
                }

                // Clear form
                input.value = '';
                document.querySelectorAll('input[name="ace"]').forEach(r => r.checked = false);
                document.querySelectorAll('input[name="ctp"]').forEach(r => r.checked = false);
                document.querySelectorAll('input[name="pool"]').forEach(r => r.checked = false);

                hideNameError();
                renderCurrentList();
                renderCompleteList();
                updateAddButton();
            }
            return false;
        }

        // Remove a name from current list only
        function removeName(index) {
            currentList.splice(index, 1);
            renderCurrentList();
            return false;
        }

        // Save both lists to localStorage
        function saveList() {
            localStorage.setItem('currentList', JSON.stringify(currentList));
            localStorage.setItem('completeList', JSON.stringify(completeList));
            alert('Lists saved!');
        }

        // Clear all names from both lists
        function clearList() {
            if (confirm('Are you sure you want to clear all names?')) {
                currentList = [];
                completeList = [];
                localStorage.removeItem('currentList');
                localStorage.removeItem('completeList');
                renderCurrentList();
                renderCompleteList();
            }
            return false;
        }

        // Update add button state
        function updateAddButton() {
            const input = document.getElementById('nameInput');
            const btn = document.getElementById('addBtn');
            const clearBtn = document.getElementById('clearInputBtn');

            const hasName = input.value.trim() !== '';
            const aceSelected = document.querySelector('input[name="ace"]:checked') !== null;
            const ctpSelected = document.querySelector('input[name="ctp"]:checked') !== null;
            const poolSelected = document.querySelector('input[name="pool"]:checked') !== null;

            // Enable add button only if name and all radio groups are selected
            btn.disabled = !(hasName && aceSelected && ctpSelected && poolSelected);

            // Show/hide clear button
            if (input.value) {
                clearBtn.classList.add('show');
            } else {
                clearBtn.classList.remove('show');
            }
        }

        // Clear input box
        function clearInput() {
            const input = document.getElementById('nameInput');
            input.value = '';
            input.focus();
            updateAddButton();
            hideNameError();
        }

        // === Name validation error handling ===
        function showNameError(message) {
            const errorEl = document.getElementById('nameErrorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideNameError() {
            const errorEl = document.getElementById('nameErrorMessage');
            errorEl.classList.remove('show');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Intercept HTMX requests and handle them client-side
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.preventDefault();
        });

        // Event listeners
        document.getElementById('nameInput').addEventListener('input', () => {
            updateAddButton();
            hideNameError();
        });
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('addBtn').disabled) {
                addName();
            }
        });

        // Radio button listeners
        document.querySelectorAll('input[name="ace"], input[name="ctp"], input[name="pool"]').forEach(radio => {
            radio.addEventListener('change', updateAddButton);
        });

        // Load names on page load
        loadNames();
    </script>
</body>
</html>
