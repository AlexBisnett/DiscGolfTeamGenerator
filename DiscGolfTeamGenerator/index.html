<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 24px;
            font-size: 28px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 12px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #5568d3;
        }
        .counter {
            margin-top: 24px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 6px;
            text-align: center;
        }
        .counter-value {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            display: block;
            margin-bottom: 8px;
        }
        .counter-label {
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>GitHub Pages Test ✓</h1>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button onclick="saveName()">Save to LocalStorage</button>

        <div class="counter">
            <span class="counter-value" id="visitCount">0</span>
            <span class="counter-label">visits from this device</span>
        </div>
    </div>

    <script>
        // Load and increment visit counter
        let visits = parseInt(localStorage.getItem('visitCount') || '0');
        visits++;
        localStorage.setItem('visitCount', visits);
        document.getElementById('visitCount').textContent = visits;

        // Load saved name if exists
        const savedName = localStorage.getItem('userName');
        if (savedName) {
            document.getElementById('nameInput').value = savedName;
        }

        // Save name function
        function saveName() {
            const name = document.getElementById('nameInput').value;
            if (name.trim()) {
                localStorage.setItem('userName', name);
                alert('Saved! Refresh the page to see it persist.');
            }
        }
    </script>
</body>
</html>
